server {
    listen 80;
    listen [::]:80;
    server_name hooks.ferarana.work;
    server_tokens off;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        try_files $uri =404;
    }
    location / { return 404; }
}
# TLS server to enable ONLY after certificate issuance and app configuration.
# HTTP bootstrap above intentionally exposes no application endpoint.
