server {
    listen 80;
    listen [::]:80;
    server_name hooks.ferarana.work;
    server_tokens off;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        try_files $uri =404;
    }
    location / { return 308 https://hooks.ferarana.work$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hooks.ferarana.work;
    ssl_certificate /etc/letsencrypt/live/hooks.ferarana.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hooks.ferarana.work/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    server_tokens off;
    access_log off;
    client_max_body_size 256k;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control no-store always;
    location = /webhooks/pey {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        proxy_next_upstream off;
    }
    location / { return 404; }
}
