name: Verify MVP
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Sidecar (Go)
        working-directory: sidecar
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
